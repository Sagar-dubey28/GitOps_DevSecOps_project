name: CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  security-events: write

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: python-eks-gitops

jobs:
  test:
    name: Test Python application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r app/requirements.txt
      - run: python -m compileall app
      - run: |
          python -m pip install pytest
          cat > app/test_app.py <<'EOF'
          from app import app
          def test_health():
              client = app.test_client()
              assert client.get("/health").status_code == 200
          EOF
          PYTHONPATH=. pytest -q

  security:
    name: Dependency and IaC checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  build-scan-push:
    name: Build, scan and push image
    needs: [test, security]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHA_TAG: ${{ github.sha }}
        run: docker build -t "$REGISTRY/$ECR_REPOSITORY:$SHA_TAG" -f app/Dockerfile app

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: docker push "$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"

  update-gitops:
    name: Update Helm image tag
    needs: build-scan-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tag
        env:
          SHA_TAG: ${{ github.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("helm/python-app/values.yaml")
          s = p.read_text()
          import re
          s = re.sub(r'(?m)^  tag: ".*"$', f'  tag: "{__import__("os").environ["SHA_TAG"]}"', s)
          p.write_text(s)
          PY

      - name: Commit GitOps change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/python-app/values.yaml
          git commit -m "chore: deploy image ${{ github.sha }}" || exit 0
          git push
