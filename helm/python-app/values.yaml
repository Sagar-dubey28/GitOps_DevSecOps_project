replicaCount: 2

image:
  repository: ACCOUNT_ID.dkr.ecr.AWS_REGION.amazonaws.com/python-eks-gitops
  tag: "initial"
  pullPolicy: IfNotPresent

containerPort: 8080

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

probes:
  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 15
  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 10

ingress:
  enabled: true
  className: alb
  host: python.example.com
  certificateArn: arn:aws:acm:AWS_REGION:ACCOUNT_ID:certificate/REPLACE_ME
  healthcheckPath: /health

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1
