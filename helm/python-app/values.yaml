replicaCount: 2

image:
  # Replace ACCOUNT_ID with your AWS account ID.
  repository: 200340799102.dkr.ecr.ap-southeast-2.amazonaws.com/python-eks-gitops
  tag: "71b79b9b84fd93c20d5621e39f47cf75f0ea3184"
  pullPolicy: IfNotPresent

containerPort: 8080

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

probes:
  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

ingress:
  enabled: true
  className: alb
  host: project.sagardubey.in
  certificateArn: arn:aws:acm:ap-southeast-2:200340799102:certificate/be935e84-d872-47cc-a3d0-272241f1a433
  healthcheckPath: /health

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1
